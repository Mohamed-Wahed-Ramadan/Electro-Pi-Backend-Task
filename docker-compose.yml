services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "grep -qi 'ready for client connections' /var/opt/mssql/log/errorlog 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/ProjectManagement.API/Dockerfile
    container_name: pm-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ProjectManagementDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: "SuperSecretKeyForProjectManagementSystem2025!MustBe32Chars+"
      Jwt__Issuer: "ProjectManagementAPI"
      Jwt__Audience: "ProjectManagementClient"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__UseSSL: "false"
      Minio__PublicUrl: "http://localhost:9000"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: pm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
  minio_data:
  backend_logs:
